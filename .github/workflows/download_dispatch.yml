name: 下载JM本子 (dispatch)

# 机器人通过 GitHub API 的 workflow_dispatch 触发本工作流。
# 注意：dispatches 接口成功时只返回 204，没有响应体，也就没有 run_id。
# 所以这里给每次运行起一个可识别的名字：
#     run-name = jm-<本子id>-<RUN_TAG>
# 机器人用 RUN_TAG 精确定位自己触发的那一次运行，之后轮询状态、下载产物并发回 QQ。
run-name: jm-${{ inputs.JM_ALBUM_IDS }}-${{ inputs.RUN_TAG || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      JM_ALBUM_IDS:
        type: string
        description: 本子id（多个id用-隔开，如 '123-456-789'）
        required: false

      JM_PHOTO_IDS:
        type: string
        description: 章节id（单独下载章节，多个id同上）
        required: false

      RUN_TAG:
        type: string
        description: 机器人使用：本次请求的唯一标记（手动运行可以留空）
        default: ''
        required: false

      CLIENT_IMPL:
        type: string
        description: 客户端类型（client.impl），下载失败时，你可以尝试填入此项重试。'api' 表示移动端，'html' 表示网页端。
        default: ''
        required: false

      IMAGE_SUFFIX:
        type: string
        description: 图片后缀（download.cache.suffix），默认为空，表示不做图片格式转换。可填入例如 'png' 'jpg'
        default: ''
        required: false

      IMAGE_QUALITY:
        type: number
        description: 图片质量（1-99开启；100不压缩。此配置不支持后缀=PNG的图片。pdf模式会把图片转为JPEG压缩再合并pdf）
        default: 100
        required: false

      DIR_RULE:
        type: string
        description: 下载文件夹规则（dir_rule.rule）。默认使用配置文件的 'Bd_Aauthor_Atitle_Pindex'。
        default: ''
        required: false

      PDF_OPTION:
        description: '是否要下载后将图片合并为pdf文件'
        required: false
        type: choice
        options:
          - 否
          - 是 | 本子维度合并pdf
          - 是 | 章节维度合并pdf

      PDF_NAME_RULE:
        type: string
        description: 'PDF文件命名规则。支持字段如 Aid, Atitle, Pindex, Pid, Ptitle'
        default: ''
        required: false

      ZIP_NAME:
        type: string
        default: 本子.tar.gz
        description: 压缩文件名称
        required: false

      UPLOAD_NAME:
        type: string
        default: Click me to download
        description: 上传文件名称
        required: false

#      JM_USERNAME:
#        type: string
#        default: ''
#        description: '禁漫帐号（不建议使用，用户名和密码会泄露在日志中。最好用secrets）'
#        required: false
#
#      JM_PASSWORD:
#        type: string
#        default: ''
#        description: '禁漫密码（不建议使用，用户名和密码会泄露在日志中。最好用secrets）'
#        required: false


jobs:
  # 注意：不要在根节点加 concurrency。
  # 每次 workflow_dispatch 都会跑一次独立的 run，多人同时提交时 Actions 侧天然并发；
  # 加了 concurrency 反而会让相同/未填 id 的提交互相排队甚至取消。
  crawler:
    runs-on: ubuntu-latest
    env:
      # 工作流输入
      JM_ALBUM_IDS: ${{ github.event.inputs.JM_ALBUM_IDS }}
      JM_PHOTO_IDS: ${{ github.event.inputs.JM_PHOTO_IDS }}
      DIR_RULE: ${{ github.event.inputs.DIR_RULE }}
      CLIENT_IMPL: ${{ github.event.inputs.CLIENT_IMPL }}
      ZIP_NAME: ${{ github.event.inputs.ZIP_NAME }}
      UPLOAD_NAME: ${{ github.event.inputs.UPLOAD_NAME }}
      IMAGE_SUFFIX: ${{ github.event.inputs.IMAGE_SUFFIX }}
      IMAGE_QUALITY: ${{ github.event.inputs.IMAGE_QUALITY }}
      PDF_OPTION: ${{ github.event.inputs.PDF_OPTION }}
      PDF_NAME_RULE: ${{ github.event.inputs.PDF_NAME_RULE }}

      # 登录相关secrets
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}

      # 邮件相关secrets
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TITLE: ${{ secrets.EMAIL_TITLE }}
      EMAIL_CONTENT: ${{ secrets.EMAIL_CONTENT }}

      # 上游同步配置
      UPSTREAM_REPO: 'hect0x7/JMComic-Crawler-Python'
      UPSTREAM_REF: 'master'

      # 固定值
      JM_DOWNLOAD_DIR: /home/runner/work/jmcomic/download/

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-dev.txt

      - name: Install img2pdf
        if: ${{ inputs.PDF_OPTION != '' && inputs.PDF_OPTION != '否' }}
        run: |
          pip install img2pdf

      - name: 安装jmcomic（pip）
        if: ${{ github.ref != 'refs/heads/dev' }}
        run: |
          pip install jmcomic -i https://pypi.org/project --upgrade

      - name: 安装jmcomic（local）
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          pip install -e ./

      - name: Fork 同步上游下载脚本
        if: ${{ github.repository != env.UPSTREAM_REPO || github.ref_name != env.UPSTREAM_REF }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${{ env.UPSTREAM_REPO }}/${{ env.UPSTREAM_REF }}/usage/workflow_download.py" \
            --output usage/upstream_workflow_download.py || true

          if [ -f "usage/upstream_workflow_download.py" ] && [ -s "usage/upstream_workflow_download.py" ]; then
            mv usage/upstream_workflow_download.py usage/workflow_download.py
          fi

      - name: 运行下载脚本
        run: |
          cd ./usage/
          python workflow_download.py

      - name: 压缩文件
        id: compress
        run: |
          if [ ! -d "$JM_DOWNLOAD_DIR" ] || [ -z "$(ls -A "$JM_DOWNLOAD_DIR")" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "下载目录不存在或为空，跳过压缩"
            exit 0
          fi
          cd $JM_DOWNLOAD_DIR
          tar -zcvf "../$ZIP_NAME" ./
          mv "../$ZIP_NAME" .
          echo "has_files=true" >> $GITHUB_OUTPUT

      - name: 上传结果
        if: steps.compress.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ env.JM_DOWNLOAD_DIR }}/${{ env.ZIP_NAME }}
          if-no-files-found: warn
          retention-days: 90

      # 运行页摘要，便于在 Actions 页面一眼看到本次下载了什么
      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "### 下载 JM 本子"
            echo ""
            echo "- 本子ID：\`${JM_ALBUM_IDS:-（未填写）}\`"
            echo "- 章节ID：\`${JM_PHOTO_IDS:-（未填写）}\`"
            echo "- 运行标记：\`${{ inputs.RUN_TAG }}\`"
            echo "- 压缩包：\`$ZIP_NAME\`"
            if [ -f "$JM_DOWNLOAD_DIR/$ZIP_NAME" ]; then
              echo "- 大小：$(du -h "$JM_DOWNLOAD_DIR/$ZIP_NAME" | cut -f1)"
            else
              echo "- 状态：没有生成压缩包（下载为空或失败）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
